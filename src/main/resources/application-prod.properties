spring.application.name=fake-store-productservice
spring.config.import=aws-parameterstore:/config/products/
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=true
fake-store-url=
server.port=${SERVER_PORT:8082}
product.sync.cron=${PRODUCT_SYNC_CRON:0 0 0 * * *}
spring.data.web.pageable.serialization-mode=via-dto
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_PUBLIC_JWT_URL:http://auth-service:8081/api/internal/auth/.well-known/jwks.json}
